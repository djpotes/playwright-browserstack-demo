name: Pruebas Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_browserstack:
        description: 'Ejecutar también en BrowserStack'
        type: boolean
        default: true

jobs:
  # ------------------------------------------------------------
  # Job 1: pruebas en el runner de GitHub (no necesita credenciales)
  # ------------------------------------------------------------
  playwright-local:
    name: Playwright (runner de GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas
        run: npm test
        env:
          CI: true

      - name: Subir reporte HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ------------------------------------------------------------
  # Job 2: pruebas en BrowserStack (Chrome, WebKit y Firefox)
  # Requiere los secrets BROWSERSTACK_USERNAME y BROWSERSTACK_ACCESS_KEY
  # ------------------------------------------------------------
  browserstack:
    name: Playwright en BrowserStack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch' || inputs.run_browserstack
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Verificar credenciales
        id: creds
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "::warning::Faltan los secrets de BrowserStack. Se omiten las pruebas en BrowserStack."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Instalar dependencias
        if: steps.creds.outputs.ok == 'true'
        run: npm install

      - name: Ejecutar pruebas en BrowserStack
        if: steps.creds.outputs.ok == 'true'
        run: npm run test:bs

      - name: Subir logs de BrowserStack
        if: always() && steps.creds.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-logs
          path: log/
          if-no-files-found: ignore
          retention-days: 14
