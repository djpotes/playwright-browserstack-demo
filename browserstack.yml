# =============================================
# Configuración de BrowserStack para Playwright
# =============================================
# Las credenciales se leen de las variables de entorno
# BROWSERSTACK_USERNAME y BROWSERSTACK_ACCESS_KEY.
# NO pongas tus credenciales reales en este archivo.
userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

framework: playwright

# Nombres que verás en el dashboard de BrowserStack Automate
projectName: Playwright BrowserStack Demo
buildName: demo-build
buildIdentifier: '#${BUILD_NUMBER}'

# Navegadores / sistemas operativos donde corren las pruebas
platforms:
  - os: Windows
    osVersion: 11
    browserName: chrome
    browserVersion: latest
  - os: OS X
    osVersion: Sonoma
    browserName: playwright-webkit
    browserVersion: latest
  - os: Windows
    osVersion: 11
    browserName: playwright-firefox
    browserVersion: latest

# Sesiones en paralelo por cada plataforma
parallelsPerPlatform: 1

# true solo si pruebas localhost o ambientes internos
browserstackLocal: false

# Depuración y reportes
debug: true
networkLogs: true
consoleLogs: info
testObservability: true
